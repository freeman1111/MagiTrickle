name: Build Keenetic Giga KN-1012 IPK

on:
  push:
    branches: [build/kn1012-restart-readiness]

permissions:
  contents: read
  packages: read

jobs:
  entware:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Prepare the mt-c Entware feed
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/dan0102dan/mt-c.git refs/tags/0.8.6:refs/tags/0.8.6
          cp config/entware/aarch64-3.10_kn.config .config
          mkdir -p .build "$RUNNER_TEMP/mt-c-feed/mt-c" "$RUNNER_TEMP/mt-c-artifacts"
          eval export $(make _return_export_dynamic_env)
          make build_frontend FRONTEND_OUT_DIR="$GITHUB_WORKSPACE/src/frontend/dist"
          feed="$RUNNER_TEMP/mt-c-feed/mt-c"
          cp tools/ci/entware-package/Makefile "$feed/Makefile"
          cp files/entware/_ipk/control/postinst "$feed/postinst"
          printf 'MAGITRICKLE_VERSION:=%s\nMAGITRICKLE_RELEASE:=%s\nMAGITRICKLE_TARGET:=aarch64-3.10_kn\n' \
            "$PKG_VERSION" "$PKG_REVISION" > "$feed/version.mk"
          tar -czf "$feed/mt-c-source.tar.gz" --transform "s,^,mt-c-${PKG_VERSION}/," \
            LICENSE files src/backend-c src/frontend/dist
      - name: Authenticate Entware builder registry
        env:
          GHCR_TOKEN: ${{ github.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/mt-c-docker-auth
        run: bash tools/ci/login-ghcr.sh
      - name: Build with the project-pinned Entware SDK
        uses: ownik/gh-action-entware-sdk@003ddc33bb3b12a2f96e0c4689c56351614cf01a
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/mt-c-docker-auth
          ARCH: aarch64-3.10
          ARTIFACTS_DIR: ${{ runner.temp }}/mt-c-artifacts
          BUILD_LOG: 1
          FEED_DIR: ${{ runner.temp }}/mt-c-feed
          PACKAGES: mt-c
          V: s
      - name: Verify package and record source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(find "$RUNNER_TEMP/mt-c-artifacts" -type f -name 'mt-c_*.ipk')
          test "${#packages[@]}" -eq 1
          package="${packages[0]}"
          python3 tools/ci/check-entware-ipk.py --package "$package" --postinst files/entware/_ipk/control/postinst
          mkdir -p output
          cp "$package" output/
          git rev-parse HEAD > output/source-commit.txt
          (cd output && sha256sum -- *.ipk > SHA256SUMS)
      - name: Upload verified IPK
        uses: actions/upload-artifact@v4
        with:
          name: mt-c-keenetic-kn1012
          path: output/
          if-no-files-found: error
      - name: Remove Entware registry credentials
        if: always()
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/mt-c-docker-auth
        run: rm -f -- "${DOCKER_CONFIG:?}/config.json"
